<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#f4f4f6"/>

  <!-- status bar -->
  <rect width="390" height="54" fill="#ffffff"/>
  <text x="28" y="34" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1c1c1e">9:41</text>

  <!-- app header -->
  <rect y="54" width="390" height="72" fill="#ffffff"/>
  <text x="24" y="100" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1c1c1e">Your App</text>

  <!-- content cards -->
  <g>
    <rect x="20" y="150" width="350" height="120" rx="18" fill="#ffffff"/>
    <rect x="44" y="176" width="180" height="16" rx="8" fill="#d8d8dc"/>
    <rect x="44" y="204" width="260" height="12" rx="6" fill="#e6e6ea"/>
    <rect x="44" y="226" width="120" height="12" rx="6" fill="#e6e6ea"/>
  </g>
  <g>
    <rect x="20" y="286" width="350" height="120" rx="18" fill="#ffffff"/>
    <rect x="44" y="312" width="150" height="16" rx="8" fill="#d8d8dc"/>
    <rect x="44" y="340" width="260" height="12" rx="6" fill="#e6e6ea"/>
    <rect x="44" y="362" width="200" height="12" rx="6" fill="#e6e6ea"/>
  </g>
  <g>
    <rect x="20" y="422" width="350" height="120" rx="18" fill="#ffffff"/>
    <rect x="44" y="448" width="200" height="16" rx="8" fill="#d8d8dc"/>
    <rect x="44" y="476" width="260" height="12" rx="6" fill="#e6e6ea"/>
    <rect x="44" y="498" width="90" height="12" rx="6" fill="#e6e6ea"/>
  </g>

  <!-- tab bar -->
  <rect y="784" width="390" height="60" fill="#ffffff"/>
  <circle cx="97" cy="814" r="14" fill="#7c3aed"/>
  <circle cx="195" cy="814" r="14" fill="#d8d8dc"/>
  <circle cx="293" cy="814" r="14" fill="#d8d8dc"/>

  <!-- unmistakable placeholder watermark, not a real app -->
  <rect y="600" width="390" height="130" fill="#0a0a0c" opacity="0.82"/>
  <text x="195" y="655" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">SAMPLE</text>
  <text x="195" y="690" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">SCREENSHOT</text>
  <text x="195" y="715" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c9c9d1" text-anchor="middle">Not a real app — replace with an uploaded screenshot</text>
</svg>
